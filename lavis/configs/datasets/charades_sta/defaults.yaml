datasets:
  charades_sta: # name of the dataset builder
    # data_dir: ${env.data_dir}/datasets
    data_type: videos # [images|videos|features]
    build_info:
      # Be careful not to append minus sign (-) before split to avoid itemizing
      annotations:
        train:
          url: /path/to/your/annotations/Charades/Charades_STA/lavis/train.json
          storage: /path/to/your/annotations/Charades/Charades_STA/lavis/train.json
        val:
          url: /path/to/your/annotations/Charades/Charades_STA/lavis/new_val_float.json
          storage: /path/to/your/annotations/Charades/Charades_STA/lavis/new_val_float.json
        test:
          url: /path/to/your/annotations/Charades/Charades_STA/lavis/test_float.json
          storage: /path/to/your/annotations/Charades/Charades_STA/lavis/test_float.json
      videos:
        storage: /path/to/your/raw/Charades