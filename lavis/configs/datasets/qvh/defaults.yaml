datasets:
  qvh: # name of the dataset builder
    data_type: videos # [images|videos|features]
    build_info:
      # Be careful not to append minus sign (-) before split to avoid itemizing
      annotations:
        train:
          # url: Your/path/to/train.json
          # storage: /path/to/your/annotations/QVHighlights/highlight_train_release.json
          url: /path/to/your/annotations/QVHighlights/lavis/train.json
          storage: /path/to/your/annotations/QVHighlights/lavis/train.json
        val:
          # url: Your/path/to/val.json
          # storage: /path/to/your/annotations/QVHighlights/highlight_val_release.json
          url: /path/to/your/annotations/QVHighlights/lavis/val.json
          storage: /path/to/your/annotations/QVHighlights/lavis/val.json
        test:
          # url: Your/path/to/test_dummy.json
          # storage: Your/path/to/test_dummy.json
          # url: Your/path/to/val.json
          # storage: /path/to/your/annotations/QVHighlights/highlight_test_release.json
          url: /path/to/your/annotations/QVHighlights/lavis/test_dummy.json
          storage: /path/to/your/annotations/QVHighlights/lavis/test_dummy.json
      videos:
        storage: /path/to/your/raw/QVHighlights
