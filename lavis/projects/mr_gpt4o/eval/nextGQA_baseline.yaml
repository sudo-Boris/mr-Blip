model:
  arch: mr_gpt4o
  model_type: gpt4o
  load_finetuned: False


  prompt: ""
  max_tokens: 16384 # max tokens for gpt-4o is 16384 for completion
  task: add_duration_no_task_prompt
  
  gpt_model: "gpt-4o"
  gpt_temperature: 0 # 0.7

  image_detail: low # [low | high | auto] # https://platform.openai.com/docs/guides/vision/low-or-high-fidelity-image-understanding
  input_time_format: seconds_integers 
  # moment retrieval args
  interleave_data: False
  use_short_interleave: False
  use_timestamps: False
  use_task_prompt: True
  only_frames: True
  add_duration: False
  # ============== qa args ===============
  resample_frames: False # [True | False] whether to resample frames from the relevant moment for the answerer
  use_localizer: False
  in_context_localizer: False
  num_frames_for_answer: null  # we don't use second stage, so budget for it is irrelevant
  fps_for_answer: null # we don't use second stage, so budget for it is irrelevant
  grounded_qa: True

  
datasets:
  nextgqa:
    collate_clips: True
    vis_processor:
        eval:
          name: "gpt4o_video_eval"
          n_frms: 250
          fps: 1.4
    text_processor:
        eval:
          name: "gpt4o_caption"
    build_info:
      # Be careful not to append minus sign (-) before split to avoid itemizing
      annotations:
        train:
          # not used
          url: /path/to/your/annotations/NExT_QA/lavis/nextgqa/val.json
          storage: /path/to/your/annotations/NExT_QA/lavis/nextgqa/val.json
        val:
          url: /path/to/your/annotations/NExT_QA/lavis/nextgqa/val.json
          storage: /path/to/your/annotations/NExT_QA/lavis/nextgqa/val.json

        test:
          url: /path/to/your/annotations/NExT_QA/lavis/nextgqa/test.json
          storage: /path/to/your/annotations/NExT_QA/lavis/nextgqa/test.json
          
run:
  task: videogqa
  # optimization-specific
  batch_size_train: 1
  batch_size_eval: 1
  num_workers: 8

  # from_file: True
  # results_path: "lavis/result/mr_gpt4o/NextGQA/eval_baseline/result/val_epochbest.json"
  eval:
    post_process_gpt4o: true
    enforce_single_window: true  # or false
  
  # inference-specific
  max_len: 200
  min_len: 5
  num_beams: 5
  inference_method: "generate"

  seed: 42
  output_dir: "result/mr_gpt4o/NextGQA/eval_baseline"
  full_output_dir: "result/mr_gpt4o/NextGQA/eval_baseline"
  save_every_sample: True

  evaluate: True
  test_splits: ["val"]

  # distribution-specific
  device: "cpu"
  # world_size: 8
  # dist_url: "env://"
  distributed: False
  find_unused_parameters: False

  wandb: False
  wandb_project: "mr_BLIP2"
  wandb_name: "NextGQA_eval"
